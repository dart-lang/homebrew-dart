name: Install Dart
on:
  push:
    branches:
      - main
    paths:
      - '**.rb'
      - .github/workflows/install-dart.yml
  pull_request:
    paths:
      - '**.rb'
      - .github/workflows/install-dart.yml
jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0

      - run: brew tap dart-lang/dart

      - run: brew trust dart-lang/dart

      - run: brew install dart
