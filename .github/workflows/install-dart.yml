name: Install Dart
on:
  push:
    branches:
      - main
    paths:
      - '**.rb'
      - .github/workflows/install-dart.yml
  pull_request:
    paths:
      - '**.rb'
      - .github/workflows/install-dart.yml
jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193

      - run: brew tap dart-lang/dart

      - run: brew trust dart-lang/dart

      - run: brew install dart
