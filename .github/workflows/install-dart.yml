name: Install Dart
on:
  push:
    branches:
      - main
    paths:
      - '**.rb'
      - .github/workflows/install-dart.yml
  pull_request:
    paths:
      - '**.rb'
      - .github/workflows/install-dart.yml

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04

      - run: brew tap dart-lang/dart

      - run: brew trust dart-lang/dart

      - run: brew install dart
